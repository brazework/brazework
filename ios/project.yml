name: Forge
options:
  bundleIdPrefix: com.shualabs
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TXAL92T885
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Forge:
    type: application
    platform: iOS
    sources:
      - path: Forge
      - path: ForgeKit/Sources/ForgeKit
    info:
      path: Forge/Resources/Info.plist
      properties:
        CFBundleDisplayName: Forge
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ForgeSupabaseURL: "$(FORGE_SUPABASE_URL)"
        ForgeSupabaseAnonKey: "$(FORGE_SUPABASE_ANON_KEY)"
        ForgeWebURL: "$(FORGE_WEB_URL)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryUsageDescription: Attach photos and video to your posts.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shualabs.forge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
  ForgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ForgeUITests]
    dependencies:
      - target: Forge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Forge
schemes:
  Forge:
    build:
      targets:
        Forge: all
        ForgeUITests: [test]
    test:
      targets: [ForgeUITests]
