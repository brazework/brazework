<!--
  Supabase → Authentication → Emails → "Magic Link". Subject: Your Brazework sign-in code
  Paste this whole file as the message body (founder step in docs/accounts.md). Sent when someone
  chooses "Email me a sign-in code" on /login: the code works on that page, and the link goes to
  /auth/confirm with a token hash, so it works on any device.
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #111111;">
  <p style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 28px;">Brazework</p>
  <h1 style="font-size: 22px; line-height: 1.3; font-weight: 600; margin: 0 0 12px;">Your sign-in code</h1>
  <p style="font-size: 15px; line-height: 1.6; color: #444444; margin: 0 0 24px;">Type this code on the log-in page, or open the link on this device or any other:</p>
  <p style="margin: 0 0 28px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/feed" style="display: inline-block; background: #111111; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 500; padding: 12px 20px; border-radius: 8px;">Log in to Brazework</a>
  </p>
  <p style="font-size: 15px; line-height: 1.6; color: #444444; margin: 0 0 8px;">Your code:</p>
  <p style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 28px; letter-spacing: 0.3em; font-weight: 600; margin: 0 0 28px;">{{ .Token }}</p>
  <p style="font-size: 13px; line-height: 1.6; color: #777777; margin: 0;">The link and the code each work once. Didn't ask to log in? Ignore this email: nobody can use it without access to your inbox.</p>
</div>
