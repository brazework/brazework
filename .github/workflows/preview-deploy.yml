name: Deploy preview (forge-preview-eight.vercel.app)

# Rebuilds the shareable preview of the Next.js app every time main changes, until production
# itself runs web/ (see docs/next-migration.md). Needs three repo secrets, added by a repo admin:
#   VERCEL_TOKEN       a token from the preview project owner's Vercel account (vercel.com/account/tokens)
#   VERCEL_ORG_ID      "orgId" from web/.vercel/project.json
#   VERCEL_PROJECT_ID  "projectId" from web/.vercel/project.json
# Without them the job skips instead of failing.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/preview-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: preview-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy web/ to the preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Skip until the Vercel secrets are added
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        working-directory: .
        run: echo "::notice::Preview deploy skipped. Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID as repo secrets to turn it on."
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        with:
          node-version: 22
      - name: Pull the project's settings and environment
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "::notice::Deployed $url (alias: https://forge-preview-eight.vercel.app)"
