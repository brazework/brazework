name: Web (Next.js)

# Every push to main and every pull request touching the app or the database:
#   checks   - typecheck, lint, unit tests, production build, smoke test
#   e2e      - the full local suite (web/e2e/run.sh): a throwaway Supabase (Postgres + Auth + REST)
#              with every migration in supabase/order.txt, the SQL rule tests, then every browser
#              journey in Chrome. Same command as on a laptop.
#   security - production dependency audit and a secret scan of the git history
# Pull requests, the weekly run and Run workflow only (not every push, to stay inside a free
# plan's 2,000 Actions minutes a month; it's 7 of the 19 minutes a full run takes):
#   quality  - Lighthouse budgets (speed, accessibility, best practices) on public and logged-in
#              pages, and an OWASP ZAP baseline scan of the running app (fails on High risk).
#              Locally: npm run quality.
# Every pull request starts this workflow (main requires its checks), and the "changes" job skips
# the heavy jobs when no app or database file changed: a skipped required check counts as passing,
# so a docs-only pull request isn't left waiting for checks that never start.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["web/**", "supabase/**", ".github/workflows/web.yml"]
  workflow_dispatch:
  # Weekly, even with no pushes: catches what changes without us (new dependency advisories,
  # scanner rules, outside services) before it surprises the next push. Mondays 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      app: ${{ steps.f.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(web/|supabase/|\.github/workflows/web\.yml)'; then echo "app=true" >> "$GITHUB_OUTPUT"; else echo "app=false" >> "$GITHUB_OUTPUT"; fi

  checks:
    name: Typecheck, lint, unit tests, build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke test (pages serve, protected pages redirect)
        run: |
          npx next start -p 3000 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3000/ && break; sleep 1; done
          curl -fsS http://localhost:3000/ | grep -q "Get credit" || { echo "landing page headline missing"; exit 1; }
          for p in /signup /login /privacy; do curl -fsS -o /dev/null "http://localhost:3000$p" || { echo "failed: $p"; exit 1; }; done
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/feed); [ "$code" = "307" ] || { echo "/feed returned $code, expected 307"; exit 1; }

  e2e:
    name: End-to-end (database rules + browser journeys)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Run the suite
        run: bash e2e/run.sh
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: web/e2e/.results/
          include-hidden-files: true
          retention-days: 7
      # Every key page at iPhone and laptop size (web/e2e/m-layout.cjs), kept for each run, so a reviewer
      # can see what a change looks like without running it.
      - name: Keep layout screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-screenshots
          path: web/e2e/.results/layout/
          if-no-files-found: ignore
          retention-days: 14

  quality:
    name: Speed, accessibility and security scan
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lighthouse budgets and OWASP ZAP baseline (web/e2e/quality.sh)
        run: bash e2e/quality.sh
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            web/.lighthouse/
            web/.zap/
          include-hidden-files: true
          retention-days: 14

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit production dependencies (fails on high or critical)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan (gitleaks, whole history, values redacted)
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --config /repo/.gitleaks.toml
