name: CodeQL (code security analysis)

# GitHub's static analysis for JavaScript/TypeScript: injection, XSS, unsafe redirects and more.
# Weekly, and on every change to the app. The repo is private on a personal account, where GitHub's
# Security tab (code scanning) isn't available, so results are kept as a SARIF artifact, printed in
# the log, and the job fails on any high or critical finding.
on:
  push:
    branches: [main]
    paths: ["web/**"]
  pull_request:
    paths: ["web/**"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: codeql-results
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 30
      - name: Fail on high or critical findings
        run: |
          f=$(ls codeql-results/*.sarif | head -1)
          jq -r '.runs[].results[] as $r | .runs[].tool.driver.rules[] | select(.id == $r.ruleId) | "\(.properties["security-severity"] // "0")\t\($r.ruleId)\t\($r.locations[0].physicalLocation.artifactLocation.uri):\($r.locations[0].physicalLocation.region.startLine)\t\($r.message.text)"' "$f" | sort -rn | tee findings.tsv
          echo "$(wc -l < findings.tsv) finding(s)"
          if awk -F'\t' '$1 >= 7.0 { bad = 1 } END { exit !bad }' findings.tsv; then echo "High or critical findings above"; exit 1; fi
