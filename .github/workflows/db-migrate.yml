name: Database steps (production)

# Applies new database steps by themselves, so nobody pastes SQL by hand: staging first, then
# production. After every merge to main that touches supabase/ (and from Run workflow), staging gets
# the missing steps; production gets them only if staging took them cleanly, so every step has run
# on a real hosted Supabase before it reaches members. The steps themselves are in db-steps.yml.
#
# Every night it also brings staging up to date alone. Staging is a free project (Linear FIX-83),
# and free projects pause after about a week without use; the nightly run wakes it and keeps it in
# step, so a pull request's preview always has a working database. It never touches production.
# While staging is still in a paid organization, it isn't woken (that costs money) and the staging
# job passes with a note, so production carries on as before.
#
# Needs one repository secret: SUPABASE_ACCESS_TOKEN, a Supabase personal access token
# (supabase.com/dashboard/account/tokens) for an account in both organizations (production's and
# the free staging one).
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/db-migrate.yml", ".github/workflows/db-steps.yml", ".github/scripts/supabase-wake.mjs"]
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:

# One at a time: a second merge waits for the first to finish rather than racing it.
concurrency:
  group: db-migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    uses: ./.github/workflows/db-steps.yml
    with:
      name: staging
      project_ref: tmrbdrygwyprzwnyhyjg
      wake: true
    secrets: inherit

  production:
    needs: staging
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/db-steps.yml
    with:
      name: production
      project_ref: uwiwkjoonculpxjmzsfj
    secrets: inherit
