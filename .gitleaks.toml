# Secret scanning (gitleaks, run in CI's security job). Starts from the default rules; the allowlist
# covers values that are public by design.
[extend]
useDefault = true

[allowlist]
description = "Local-only test credentials"
paths = [
  # Supabase CLI local state: the well-known "supabase-demo" keys, never production.
  '''supabase/\.temp/''',
]
regexes = [
  # The throwaway test stack's fixed secrets (web/e2e): only valid on a laptop or CI runner.
  '''forge-local-test-secret''',
  '''whsec_forge_e2e''',
  '''cron_forge_e2e''',
  # A function name, not a key: the default linkedin-client-secret rule flags any 16 letters or
  # digits that follow the word "linkedin", and this import does (web/src/lib/linkedin-gate.ts).
  '''^saveLinkedinFrom$''',
  # The same rule on a prop name (web/src/app/(app)/settings/settings-client.tsx, FIX-254).
  '''^linkedinPublic$''',
]
