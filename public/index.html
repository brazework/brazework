<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge · The STEM network</title>
  <meta name="description" content="Forge is the professional network made only for STEM. Show what you build, connect with people in your field, and get noticed for what you can do.">
  <meta property="og:title" content="Forge: show what you build">
  <meta property="og:description" content="The professional network for STEM students and professionals.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0E1217">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='6' fill='%230E1217'/%3E%3Cpath d='M4 22 L14 4 L24 22 Z M9 22 L14 13 L19 22' fill='none' stroke='%23FF7A2F' stroke-width='2'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before anything is drawn, so there's never a flash.
    (function () {
      var t = 'dark', m = 'full', s = 'default';
      try { t = localStorage.getItem('forge.theme') || 'dark'; m = localStorage.getItem('forge.motion') || 'full'; s = localStorage.getItem('forge.textSize') || 'default'; } catch (e) {}
      if (t === 'system') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      var r = document.documentElement;
      r.setAttribute('data-theme', t);
      if (m === 'reduce') r.setAttribute('data-motion', 'reduce');
      if (s === 'large') r.classList.add('large-text');
      try { var a = localStorage.getItem('forge.accent'); if (a) r.style.setProperty('--accent', a); } catch (e) {}
    })();
  </script>
  <style>html,body{background:#0E1217}html[data-theme="light"],html[data-theme="light"] body{background:#F5F6F8}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="shell"></div>
  <main id="view" tabindex="-1"></main>
  <div id="overlay"></div>
  <noscript><p style="padding:24px">Forge needs JavaScript turned on.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
