<title>Brazework Film Titles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: the demo film's opening and closing titles on a 1920x1080 stage; each frame is renderAt(t). ?part=intro or ?part=outro. Single light look, matching the app's light palette. */
:root {
  --bg: #fbfbfa; --panel: #ffffff; --line: #e4e4e0; --fg: #1f1f1d; --fg-2: #4a4945; --muted: #787772;
  --ok: #1a7f43; --ok-tint: #e3f3e9;
  --display: "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--display); overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); transform-origin: 0 0; }
.abs { position: absolute; }
.center { left: 0; right: 0; text-align: center; }
#grid { inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 96px 96px; opacity: 0.55; mask-image: radial-gradient(60% 60% at 50% 50%, #000 20%, transparent 80%); }
#glow { inset: -10%; background: radial-gradient(35% 35% at 50% 50%, rgb(26 127 67 / 0.08), transparent 70%); }
.mark { font-size: 176px; font-weight: 900; letter-spacing: -0.06em; line-height: 1; }
.sub { font-size: 52px; font-weight: 600; color: var(--fg-2); letter-spacing: -0.03em; }
.eb { font-family: var(--mono); font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ok); }
.word { font-size: 150px; font-weight: 850; letter-spacing: -0.055em; line-height: 1; }
.word i { font-style: normal; color: var(--ok); }
.how { font-size: 96px; font-weight: 800; letter-spacing: -0.045em; }
.board { left: 296px; top: 200px; width: 1200px; padding: 56px 64px; background: var(--panel); border: 1px solid var(--line); border-radius: 36px; box-shadow: 0 40px 90px -50px rgb(0 0 0 / 0.35); display: grid; gap: 22px; }
.board h2 { margin: 0 0 10px; font-size: 64px; font-weight: 800; letter-spacing: -0.04em; }
.item { display: flex; align-items: center; gap: 22px; font-size: 36px; font-weight: 550; letter-spacing: -0.015em; }
.tick { width: 44px; height: 44px; border-radius: 50%; background: var(--ok-tint); color: var(--ok); display: grid; place-items: center; flex-shrink: 0; }
.next { margin-top: 14px; padding: 22px 26px; border-radius: 22px; border: 2px dashed var(--line); display: flex; gap: 20px; align-items: center; font-size: 34px; font-weight: 600; }
.next b { font-family: var(--mono); font-size: 20px; letter-spacing: 0.14em; color: var(--muted); font-weight: 500; }
.url { font-family: var(--mono); font-size: 34px; color: var(--ok); letter-spacing: 0.04em; }
</style>

<div id="stage">
  <div id="glow" class="abs"></div>
  <div id="grid" class="abs"></div>

  <!-- Intro -->
  <div id="i1" class="abs center" style="top:360px">
    <div class="mark">Brazework</div>
    <div class="sub" style="margin-top:22px">Home base for student clubs.</div>
  </div>
  <div id="i2" class="abs center" style="top:300px"></div>
  <div id="i3" class="abs center" style="top:430px">
    <div class="eb">The real app · a club's week</div>
    <div class="how" style="margin-top:18px">Here's how it works.</div>
  </div>

  <!-- Outro -->
  <div id="o1" class="abs board">
    <div class="eb">Where Brazework stands · November 2026</div>
    <h2>Built, tested and live.</h2>
    <div id="items"></div>
    <div id="next" class="next"><b>NEXT</b><span>First pilot with student chapters at UHart</span></div>
  </div>
  <div id="o2" class="abs center" style="top:330px">
    <div class="mark">Brazework</div>
    <div class="sub" style="margin-top:22px">Your work, signed by the people who saw it.</div>
    <div class="url" style="margin-top:44px">brazework.com</div>
  </div>
</div>

<script>
const part = new URLSearchParams(location.search).get("part") || "intro";
const DURATION = part === "outro" ? 13.5 : 10;
const $ = (id) => document.getElementById(id);
const clamp = (v) => Math.min(1, Math.max(0, v));
const p = (t, a, b) => clamp((t - a) / (b - a));
const out3 = (x) => 1 - Math.pow(1 - x, 3);
const vis = (t, a, b, fi = 0.6, fo = 0.5) => Math.min(out3(p(t, a, a + fi)), 1 - p(t, b - fo, b));
function set(el, o, y = 0, s = 1) {
  el.style.opacity = o.toFixed(3);
  el.style.transform = `translateY(${y.toFixed(1)}px) scale(${s.toFixed(4)})`;
  el.style.visibility = o <= 0.001 ? "hidden" : "visible";
}
const WORDS = [["Run", "your club."], ["Build", "your projects."], ["Prove", "your work."]];
const LIVE = ["Live at brazework.com, on the web", "Clubs and study groups: chat, events, members", "Projects with milestones and evidence", "Work verified by club officers, with their names on it", "Companies search verified work and message students", "Ember, the AI helper, drafts the busywork"];
$("items").innerHTML = LIVE.map((x) => `<div class="item"><span class="tick"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>${x}</div>`).join("");
const items = [...document.querySelectorAll(".item")];

function renderAt(t) {
  $("glow").style.transform = `translate(${Math.sin(t / 4) * 60}px, ${Math.cos(t / 5) * 40}px)`;
  ["i1", "i2", "i3", "o1", "o2"].forEach((id) => set($(id), 0));
  if (part === "intro") {
    set($("i1"), vis(t, 0.2, 3.3, 0.8), (1 - out3(p(t, 0.2, 1.2))) * 30, 0.97 + 0.03 * out3(p(t, 0.2, 2)));
    $("i2").innerHTML = WORDS.map(([a, b], i) => {
      const k = out3(p(t, 3.5 + i * 0.75, 4.1 + i * 0.75));
      return `<div class="word" style="opacity:${k.toFixed(3)};transform:translateY(${((1 - k) * 40).toFixed(1)}px);margin-bottom:22px"><i>${a}</i> ${b}</div>`;
    }).join("");
    set($("i2"), vis(t, 3.4, 7.3, 0.2, 0.5));
    set($("i3"), vis(t, 7.4, 10, 0.6, 0.4), (1 - out3(p(t, 7.4, 8.1))) * 24);
  } else {
    set($("o1"), vis(t, 0.2, 8.6, 0.7, 0.5), (1 - out3(p(t, 0.2, 1.0))) * 60);
    items.forEach((el, i) => { const k = out3(p(t, 1.0 + i * 0.45, 1.5 + i * 0.45)); el.style.opacity = k.toFixed(3); el.style.transform = `translateX(${((1 - k) * -30).toFixed(1)}px)`; });
    const nk = out3(p(t, 4.2, 4.8)); $("next").style.opacity = nk.toFixed(3); $("next").style.transform = `translateY(${((1 - nk) * 20).toFixed(1)}px)`;
    set($("o2"), vis(t, 8.8, 99, 0.9), (1 - out3(p(t, 8.8, 9.8))) * 30, 0.97 + 0.03 * out3(p(t, 8.8, 10.5)));
  }
}
window.renderAt = renderAt; window.DURATION = DURATION;
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); $("stage").style.transform = `scale(${s})`; }
addEventListener("resize", fit); fit();
renderAt(part === "outro" ? 13 : 1.6);
</script>
